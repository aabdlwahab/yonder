[package]
name = "yonder_hub"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "yonder-hub"
path = "src/main.rs"

[dependencies]
acp_thread.workspace = true
agent-client-protocol.workspace = true
agent_servers.workspace = true
agent_ui.workspace = true
anyhow.workspace = true
askpass.workspace = true
async-tungstenite.workspace = true
base64.workspace = true
axum = { version = "0.6.20", default-features = false, features = ["json", "ws"] }
clap.workspace = true
client.workspace = true
collections.workspace = true
db.workspace = true
debug_adapter_extension.workspace = true
env_logger.workspace = true
extension.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
hyper = { version = "0.14.32", features = ["http1", "server"] }
language.workspace = true
language_extension.workspace = true
language_model.workspace = true
language_models.workspace = true
languages = { workspace = true, features = ["load-grammars"] }
log.workspace = true
node_runtime.workspace = true
paths.workspace = true
project.workspace = true
prompt_store.workspace = true
release_channel.workspace = true
recent_projects.workspace = true
remote.workspace = true
reqwest_client.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
shellexpand.workspace = true
smol.workspace = true
rand.workspace = true
# Web Push encryption and signing; already in the tree through rustls.
ring = "0.17"
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = "2.2"
semver.workspace = true
subtle = "2.6"
terminal_view.workspace = true
theme.workspace = true
theme_settings.workspace = true
tokio = { workspace = true, features = ["macros", "net", "time"] }
tokio-rustls.workspace = true
util.workspace = true
watch.workspace = true

[dev-dependencies]
tempfile.workspace = true
